generator = "/tmp/opencode/generate_bargaining_baseline.jl"
generator_command = "julia --project=. /tmp/opencode/generate_bargaining_baseline.jl test/fixtures/bargaining_baseline.toml"
julia_version = "1.12.7"
value_encoding = "every Float64 is a quoted Julia repr string; read back with parse(Float64, s) and compare with isequal"
