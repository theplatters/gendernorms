# bargaining_baseline.toml: exact pre-optimization behavior fixtures of
# the household bargaining solver, the equivalence basis for a later
# optimization of `set_theta!`/`bargain_transfer` (see `MDR-0002` and
# `MDR-0005`). Generated ONCE by running the CURRENT package code.
#
# Provenance: git SHA 5c58565d42a17d730fea0c29f55a8e9be1655c93, generator /tmp/opencode/generate_bargaining_baseline.jl (throwaway, outside
# the repository), Julia 1.12.7. Regenerate with the
# `generator_command` in [meta]; the generator is deterministic and
# re-running it reproduces this file byte-for-byte (verified).
#
# Value encoding: every Float64 (inputs and outputs) is a quoted Julia
# `repr` string ("0.1", "-Inf", "NaN", "-0.0"). Read it back with
# `parse(Float64, s)` and compare with `isequal`, so NaN matches NaN
# and -0.0 does not match 0.0. Ints and bools are bare TOML values,
# enumerations are bare strings. `float_count` in [meta] is the number
# of Float64 values the generator round-trip verified while writing.
#
# [solver]: exact inputs and outputs of the pure solver chain of
# `src/resources/utility_functions.jl` and
# `src/systems/household_bargaining.jl`, evaluated with
# `GenderNorms.bargain_transfer`, `GenderNorms.mutual_best_response`,
# `GenderNorms.outside_options`, `GenderNorms.nash_product`,
# `GenderNorms.equilibrium_payoff`, and `GenderNorms.maximize_1d`.
# Grid: 20 fixed cases (ids 1-20; the six hand-checkable cases of
# `test/test_household_bargaining.jl` plus boundary corners and the
# infeasible branches) followed by 180 draws (ids 21-200) from
# `Random.MersenneTwister(1)`. Each draw picks `levels[rand(rng,
# 1:length(levels))]` per factor in the order theta_init, hw_init,
# hm_init, wage pair, conformism, alpha, spec, N_h of the woman,
# N_h of the man, N_theta, over the levels: theta_init and N_theta in
# {-1.0, -0.5, 0.0, 0.5, 1.0}; hw_init, hm_init, and both N_h in
# {0.0, 0.25, 0.5, 0.75, 1.0}; wage pairs (wage_w, wage_m) in
# {(0.05, 2.0), (0.6, 1.2), (1.0, 1.0), (1.2, 0.6), (2.0, 0.05)}
# (the 40:1 extreme corner of `MDR-0005`); conformism in
# {0.0, 10.0, 50.0}; alpha in {0.1, 0.5, 0.9}; specs additive,
# ces with beta 0.2 and beta 0.5, multiplicative, and
# multiplicative_weighted. Wage pair, conformism, alpha, and N_theta
# are shared by both partners in the draws; the fixed cases set every
# partner field explicitly. Partner bundles: `pw_*` is the woman
# (`is_woman = true`), `pm_*` the man (`is_woman = false`); each
# partner's `wage_spouse` is the other's `wage_self`, and
# `N_h_spouse` is the other's `N_h`.
# Outputs: `bt_*` = `bargain_transfer(hw_init, hm_init, theta_init,
# pw, pm, config)`; `mbr_*` = `mutual_best_response` at the clamped
# status-quo transfer `clamp(theta_init, -1, 1)` (all grid values are
# already in [-1, 1]); `uw_out`, `um_out` = `outside_options`;
# `status_payoff` = the status-quo Nash product; `best_theta` and
# `best_payoff` = the internal `maximize_1d` maximizer over [-1, 1]
# with `TRANSFER_TOL` and its Nash product (NaN when the maximizer is
# not finite, which the package skips); `branch` = "improving" when
# the maximizer beats the status quo (the package commits it), else
# "fallback" (status quo kept); `status_finite` and
# `maximizer_finite` classify the infeasible (-Inf payoff) and
# NaN-maximizer branches.
#
# [trajectory]: runs of `create_world` + `GN.run` with seeds 1 and 2,
# 25 agents per gender, 10 ticks (0-9), CES utility (beta 0.5), and
# the `watts_strogatz` network (neighbors_per_side 2, rewiring 0.1)
# or `homogeneous_mixing`; all other model keys are package defaults.
# `metric_*` are the exact `GN.run` metric series (recomputed by a
# manual per-tick drive that must match them exactly; asserted while
# generating). `[[trajectory.run.agent]]` is the snapshot ordering:
# `GN.entities_with(world, GN.Female)` followed by
# `GN.entities_with(world, GN.Male)`, i.e. the Ark.Query iteration
# order of the world (entity creation order of `initialize_household`),
# with 1-based `index`, `gender`, and the 1-based `spouse_index`.
# `[[trajectory.run.snapshot]]` records `WorkingTime.current` and
# `TransferToWoman.current` of every agent in that order at two
# phases per tick: "post_set_theta" (after `set_theta!`) and
# "end_of_tick" (after `update_old_working_time_and_transfer!`,
# `update_global_working_times!`, and `update_preferences`); the two
# phases carry identical values under the current pipeline (asserted
# while generating, see `snapshot_phases_identical`), recorded twice
# so later tests can isolate the kernel and catch drift.

