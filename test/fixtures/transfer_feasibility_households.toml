# transfer_feasibility_households.toml: parameter fixtures of the three
# seed-1 benchmark households whose strictly positive near-zero transfer
# payoffs the pre-`MDR-0012` unseeded Brent transfer search missed
# (recorded in `benchmark/transfer_search_diagnosis.md`), plus the
# demonstrated candidate each regression test must beat.
#
# Provenance: the initial state (tick 0, before the first tick) of the
# seed-1, 500-agents-per-gender `watts_strogatz` run (neighbors_per_side
# 2, rewiring 0.1), CES utility with beta 0.5, all other keys package
# defaults; extracted with the same component extraction and
# `norm_means`/`payoff_params` calls as `set_theta!` (see `MDR-0012`).
# Generator /tmp/opencode/generate_transfer_households.jl (throwaway,
# outside the repository), Julia 1.12.7. Regenerate with the
# `generator_command` in [meta]; the generator re-verifies every
# `demo_payoff` bitwise before writing.
#
# Value encoding: every Float64 is a quoted Julia `repr` string; read it
# back with `parse(Float64, s)` and compare with `isequal`.
#
# [[household]]: `id` is the 1-based position of the woman in
# `SocialNetwork.women_entities`. `pw_*` and `pm_*` are the
# `AgentPayoffParams` fields of the woman (`is_woman = true`) and the man
# (`is_woman = false`) exactly as `set_theta!` builds them; `hw_init`,
# `hm_init`, and `theta_init` are the household's `WorkingTime.current`
# and `TransferToWoman.current` at tick 0; `uw_out`, `um_out` are the
# zero-transfer outside options and `hw_status`, `hm_status` the
# status-quo labour equilibrium the solver warm-starts from. `demo_theta`
# and `demo_payoff` are the demonstrated positive Nash payoff from
# `benchmark/transfer_search_diagnosis.md`, re-derived bitwise by the
# generator; `demo2_theta`/`demo2_payoff` (household 85 only) record its
# second demonstrated point. The regression test requires
# `bargain_transfer` to commit a nonzero transfer whose cached payoff is
# finite and at least `demo_payoff`.

[meta]
generator = "/tmp/opencode/generate_transfer_households.jl"
generator_command = "julia --project=. /tmp/opencode/generate_transfer_households.jl test/fixtures/transfer_feasibility_households.toml"
julia_version = "1.12.7"
source = "seed 1, 500 agents per gender, watts_strogatz neighbors_per_side 2 rewiring 0.1, ces beta 0.5; tick-0 initial state"
value_encoding = "every Float64 is a quoted Julia repr string; read back with parse(Float64, s) and compare with isequal"

