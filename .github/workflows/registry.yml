name: registry

on:
  push:
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Run registry validator
        run: julia scripts/registry_check.jl --strict
